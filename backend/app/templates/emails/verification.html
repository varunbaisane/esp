<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Verify your Email Address</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #4f46e5; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { background-color: #ffffff; padding: 30px; border: 1px solid #e5e7eb; border-top: none; border-radius: 0 0 8px 8px; }
        .otp { font-size: 32px; font-weight: bold; letter-spacing: 4px; color: #4f46e5; text-align: center; margin: 30px 0; padding: 15px; background-color: #f3f4f6; border-radius: 8px; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #6b7280; }
    </style>
</head>
<body>
    <div class="header">
        <h1 style="margin: 0; font-size: 24px;">Welcome to ESP</h1>
    </div>
    <div class="content">
        <p>Hello,</p>
        <p>Thank you for registering. Please use the following verification code to activate your account:</p>
        <div class="otp">{otp}</div>
        <p>This code will expire in {expiry_minutes} minutes.</p>
        <p>If you did not create an account, you can safely ignore this email.</p>
    </div>
    <div class="footer">
        &copy; 2026 Engineering Support Platform
    </div>
</body>
</html>
