[tool.poetry]
name = "engineering-support-platform-backend"
version = "0.1.0"
description = "Backend for the Engineering Support Escalation Platform"
package-mode = false
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.0"
pytest-asyncio = "^1.4.0"
httpx = "^0.28.1"
pytest-cov = "^7.1.0"
mypy = "^2.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = "^0.30.0"
pydantic-settings = "^2.3.0"
sqlalchemy = "^2.0.0"
psycopg = {version = "^3.1.0", extras = ["binary"]}
alembic = "^1.13.0"
pwdlib = {extras = ["argon2"], version = "^0.3.0"}
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
jinja2 = "^3.1.6"
resend = "^2.32.2"
sib-api-v3-sdk = "^7.6.0"
redis = "^8.0.1"

[tool.mypy]
python_version = "3.14"
pretty = true
warn_return_any = true
warn_unused_configs = true
